<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Screenshot</title>
  <style>
    :root {
      --accent: #2563eb; --accent-hover: #1d4ed8;
      --bg: #f4f4f6; --surface: #ffffff; --border: #e6e6ea;
      --text: #18181b; --muted: #71717a; --track: #ececef;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #3b82f6; --accent-hover: #60a5fa;
        --bg: #0e0e10; --surface: #1a1a1d; --border: #2c2c31;
        --text: #f4f4f5; --muted: #a1a1aa; --track: #2a2a2e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* --- sticky top chrome --- */
    .top { position: sticky; top: 0; z-index: 10;
           background: var(--surface); border-bottom: 1px solid var(--border); }
    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; }
    .brand .ico {
      width: 30px; height: 30px; border-radius: 9px; display: flex;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 2px 6px rgba(37,99,235,.35);
    }
    .brand .name { font-size: 15px; }
    .spacer { flex: 1; }
    .badge {
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: var(--bg); border: 1px solid var(--border);
      padding: 5px 10px; border-radius: 999px; font-variant-numeric: tabular-nums;
    }

    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 20px;
    }
    .field { display: flex; align-items: center; gap: 0; }
    .field input {
      font: inherit; font-weight: 600; padding: 8px 4px 8px 12px;
      border: 1px solid var(--border); border-right: none;
      border-radius: 10px 0 0 10px; background: var(--surface); color: var(--text);
      width: 240px; outline: none;
    }
    .field input:focus { border-color: var(--accent); }
    .field .ext {
      padding: 8px 12px 8px 2px; border: 1px solid var(--border); border-left: none;
      border-radius: 0 10px 10px 0; background: var(--surface); color: var(--muted);
      font-weight: 600;
    }
    select {
      font: inherit; font-weight: 600; padding: 8px 10px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      outline: none; cursor: pointer;
    }
    select:focus { border-color: var(--accent); }
    .divider { width: 1px; height: 26px; background: var(--border); margin: 0 2px; }
    .btn {
      font: inherit; font-weight: 600; font-size: 13px; padding: 8px 16px;
      border-radius: 10px; border: 1px solid transparent; cursor: pointer;
      transition: background .15s, border-color .15s, opacity .15s;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .btn.primary { background: var(--accent); color: #fff;
                   box-shadow: 0 1px 3px rgba(37,99,235,.4); }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.ghost { background: transparent; border-color: var(--border); color: var(--text); }
    .btn.ghost:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn svg { width: 15px; height: 15px; }

    .hint { padding: 9px 20px; font-size: 12.5px; color: var(--muted);
            background: var(--bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 7px; }

    #stageWrap { padding: 28px; display: flex; justify-content: center; }
    #stage { position: relative; max-width: 1040px; width: 100%; line-height: 0;
             border-radius: 12px; overflow: hidden;
             box-shadow: 0 4px 24px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.1); }
    #pieces > * { width: 100%; display: block; }
    #pieces .slot { background: var(--track); }
    #overlay { position: absolute; inset: 0; cursor: crosshair; }
    #selbox { position: absolute; border: 2px solid var(--accent);
              box-shadow: 0 0 0 9999px rgba(0,0,0,.45); display: none;
              border-radius: 2px; }

    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(8px);
      background: #18181b; color: #fff; padding: 11px 20px; border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,.3); font-weight: 600; font-size: 13px;
      opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
      display: flex; align-items: center; gap: 8px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #b42318; }
    .notice { padding: 9px 20px; font-size: 12.5px; color: var(--text);
              background: color-mix(in srgb, #f59e0b 12%, var(--surface));
              border-bottom: 1px solid var(--border); }
    .notice div + div { margin-top: 3px; }
    .status { padding: 9px 20px; font-size: 12.5px; color: var(--muted);
              border-bottom: 1px solid var(--border); }
    #err { padding: 80px 20px; text-align: center; color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>
  <div class="top" id="top" style="display:none">
    <div class="header">
      <div class="brand">
        <span class="ico">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M4 8.5C4 7.4 4.9 6.5 6 6.5H7.4L8.3 5.1C8.5 4.7 8.9 4.5 9.3 4.5H14.7C15.1 4.5 15.5 4.7 15.7 5.1L16.6 6.5H18C19.1 6.5 20 7.4 20 8.5V17C20 18.1 19.1 19 18 19H6C4.9 19 4 18.1 4 17V8.5Z" stroke="white" stroke-width="1.6"/>
            <circle cx="12" cy="12.5" r="3.2" stroke="white" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="name">Screenshot</span>
      </div>
      <div class="spacer"></div>
      <span class="badge" id="dims"></span>
    </div>
    <div class="toolbar">
      <div class="field">
        <input id="filename" type="text" spellcheck="false">
        <span class="ext" id="ext">.png</span>
      </div>
      <select id="format" title="File format">
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="webp">WebP</option>
      </select>
      <div class="divider"></div>
      <button class="btn ghost" id="crop" disabled>Crop to selection</button>
      <button class="btn ghost" id="reset" disabled>Reset</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="copy">
        <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.8"/></svg>
        Copy
      </button>
      <button class="btn primary" id="download">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download
      </button>
    </div>
    <div class="hint" id="hint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Drag on the image to select a region, then Crop — or just Download / Copy to export the selection. Copy always uses PNG.
    </div>
    <div class="notice" id="notice" hidden></div>
    <div class="status" id="status" hidden></div>
  </div>

  <div id="stageWrap" style="display:none">
    <div id="stage">
      <div id="pieces"></div>
      <div id="overlay"><div id="selbox"></div></div>
    </div>
  </div>
  <div id="err" style="display:none"></div>
  <div class="toast" id="toast"></div>
  <script src="png.js"></script>
  <script src="capture-store.js"></script>
  <script src="result.js"></script>
</body>
</html>
