<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --accent: #2563eb; --accent2: #3b82f6;
      --surface: #ffffff; --text: #18181b; --muted: #71717a; --track: #e9e9ee;
      --border: #e6e6ea; --hover: #f4f4f6;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #1c1c1f; --text: #f4f4f5; --muted: #a1a1aa; --track: #2c2c31;
              --border: #2c2c31; --hover: #26262b; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 300px; padding: 16px; background: var(--surface); color: var(--text);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* --- launcher --- */
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .brand .ico {
      width: 30px; height: 30px; border-radius: 9px; display: flex;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      box-shadow: 0 2px 6px rgba(37,99,235,.4);
    }
    .brand .name { font-size: 15px; font-weight: 650; }
    .actions { display: flex; flex-direction: column; gap: 8px; }
    .action {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      padding: 12px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface); color: var(--text); cursor: pointer;
      font: inherit; transition: background .15s, border-color .15s;
    }
    .action:hover { background: var(--hover); border-color: var(--accent); }
    .action .badge {
      flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .action .badge.blue { background: linear-gradient(135deg, var(--accent2), var(--accent)); }
    .action .badge.violet { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .action .badge.rainbow { background: conic-gradient(from 0deg, #ef4444, #f59e0b, #10b981, #3b82f6, #8b5cf6, #ef4444); }
    .action .t { flex: 1; }
    .action .t b { display: block; font-size: 13.5px; font-weight: 650; }
    .action .t span { font-size: 12px; color: var(--muted); }

    /* --- progress (capture) --- */
    #progress { display: none; }
    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .head .ico {
      flex: 0 0 auto; width: 36px; height: 36px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      box-shadow: 0 2px 8px rgba(37,99,235,.4); transition: background .3s;
    }
    .head .ico.done { background: linear-gradient(135deg, #34d399, #10b981); }
    .head .ico.err  { background: linear-gradient(135deg, #f87171, #ef4444); }
    .txt { flex: 1 1 auto; min-width: 0; }
    .title { font-size: 15px; font-weight: 650; line-height: 1.2; }
    .sub { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-top: 3px; }
    .pct { flex: 0 0 auto; font-size: 15px; font-weight: 650; color: var(--accent);
           font-variant-numeric: tabular-nums; }
    .pct.done { color: #10b981; }
    .track { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .fill { height: 100%; border-radius: 999px; width: 6%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width .35s cubic-bezier(.4,0,.2,1); }
    .fill.done { background: linear-gradient(90deg, #34d399, #10b981); }
    .fill.err  { background: linear-gradient(90deg, #f87171, #ef4444); }
    .track.indet .fill { width: 40% !important; transition: none; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    .foot { margin-top: 12px; font-size: 11.5px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="launcher">
    <div class="brand">
      <span class="ico">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M4 8.5C4 7.4 4.9 6.5 6 6.5H7.4L8.3 5.1C8.5 4.7 8.9 4.5 9.3 4.5H14.7C15.1 4.5 15.5 4.7 15.7 5.1L16.6 6.5H18C19.1 6.5 20 7.4 20 8.5V17C20 18.1 19.1 19 18 19H6C4.9 19 4 18.1 4 17V8.5Z" stroke="white" stroke-width="1.6"/>
          <circle cx="12" cy="12.5" r="3.2" stroke="white" stroke-width="1.6"/>
        </svg>
      </span>
      <span class="name">Capture &amp; Inspect</span>
    </div>
    <div class="actions">
      <button class="action" id="btnCapture">
        <span class="badge blue">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 8.5C4 7.4 4.9 6.5 6 6.5H7.4L8.3 5.1C8.5 4.7 8.9 4.5 9.3 4.5H14.7C15.1 4.5 15.5 4.7 15.7 5.1L16.6 6.5H18C19.1 6.5 20 7.4 20 8.5V17C20 18.1 19.1 19 18 19H6C4.9 19 4 18.1 4 17V8.5Z" stroke="white" stroke-width="1.6"/><circle cx="12" cy="12.5" r="3.2" stroke="white" stroke-width="1.6"/></svg>
        </span>
        <span class="t"><b>Full-page screenshot</b><span>Scroll, stitch &amp; edit the whole page</span></span>
      </button>
      <button class="action" id="btnInspect">
        <span class="badge violet">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4l7 16 2-6 6-2z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </span>
        <span class="t"><b>Inspect element</b><span>Read styles &amp; copy exact context for AI</span></span>
      </button>
      <button class="action" id="btnPalette">
        <span class="badge rainbow"></span>
        <span class="t"><b>Extract palette</b><span>Every color on the page as design tokens</span></span>
      </button>
    </div>
  </div>

  <div id="progress">
    <div class="head">
      <div class="ico" id="ico">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 8.5C4 7.4 4.9 6.5 6 6.5H7.4L8.3 5.1C8.5 4.7 8.9 4.5 9.3 4.5H14.7C15.1 4.5 15.5 4.7 15.7 5.1L16.6 6.5H18C19.1 6.5 20 7.4 20 8.5V17C20 18.1 19.1 19 18 19H6C4.9 19 4 18.1 4 17V8.5Z" stroke="white" stroke-width="1.6"/>
          <circle cx="12" cy="12.5" r="3.2" stroke="white" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="txt">
        <div class="title" id="title">Capturing full page</div>
        <div class="sub" id="sub">Starting…</div>
      </div>
      <div class="pct" id="pct"></div>
    </div>
    <div class="track indet" id="track"><div class="fill" id="fill"></div></div>
    <div class="foot" id="foot">Keep this window open while it captures.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
