<!doctype html>
<meta charset="utf-8">
<title>Fixture: floating buttons that appear only after the page scrolls</title>
<!-- Nothing floats over the page at scroll 0. Once the page is scrolled
     past 300px, two "back to top" buttons (magenta) appear, the way sites
     add them:
     - a zero-height `position: sticky; bottom: 24px` box added at the end of
       the content, its button positioned out of it (www.louvre.fr);
     - a classic `position: fixed` button in the bottom-right corner.
     And a closed side drawer (a <nav>, fixed, parked off the left edge of
     the screen) whose hard shadow (green) shows 30px into the first screen,
     as an accessibility widget's panel does (www.richardscriminallaw.com).
     A visitor sees the buttons only while scrolling and the shadow only on
     the screen at hand; none of them belongs in the capture, least of all
     once per tile. -->
<style>
  html,body{margin:0;overflow-anchor:none}
  .totop{position:sticky;bottom:24px;height:0}
  .totop button{position:absolute;right:220px;bottom:80px;width:52px;height:52px;border-radius:50%;border:0;background:rgb(255,0,255)}
  #fx{position:fixed;right:300px;bottom:30px;width:60px;height:60px;border-radius:50%;border:0;background:rgb(255,0,255)}
  #drawer{position:fixed;top:0;left:-580px;width:580px;height:100vh;background:#fff;box-shadow:30px 0 0 0 rgb(0,255,0);z-index:9999}
</style>
<script src="bands.js"></script>
<nav id="drawer" aria-label="Accessibility"><a href="#a">Contrast</a> <a href="#b">Text size</a> <a href="#c">Links</a></nav>
<main id="m"></main>
<script>
  const m = document.getElementById('m');
  addBands(m, 0, 25);
  let added = false;
  addEventListener('scroll', () => {
    if (added || scrollY < 300) return;
    added = true;
    const s = document.createElement('div');
    s.className = 'totop';
    s.innerHTML = '<button type="button" aria-label="Back to top"></button>';
    m.appendChild(s);
    const f = document.createElement('button');
    f.id = 'fx';
    f.setAttribute('aria-label', 'Back to top');
    document.body.appendChild(f);
  });
</script>
