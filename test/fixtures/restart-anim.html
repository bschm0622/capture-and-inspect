<!doctype html>
<meta charset="utf-8">
<title>Fixture: an SVG animation the page restarts when the page scrolls</title>
<!-- A 1100px SVG whose colour an animation library steps every frame for
     2.5s, like a Lottie hero, and which the page plays again from the start
     whenever the page scrolls and it isn't playing. The capture's first
     scroll after its first shot sets it going again. It is cut by the first
     tile edge; both parts must show the same frame. -->
<style>
  html,body{margin:0;overflow-anchor:none}
  svg{display:block;width:100%;height:1100px}
</style>
<script src="bands.js"></script>
<svg viewBox="0 0 1388 1100" preserveAspectRatio="none"><rect id="r" x="0" y="0" width="1388" height="1100" fill="rgb(0,0,0)"/><g id="t"><text x="40" y="120" font-size="64" fill="#fff" font-family="sans-serif">Animated hero</text></g></svg>
<main id="m"></main>
<script>
  addBands(document.getElementById('m'), 6, 20);
  const rect = document.getElementById('r');
  // Text over the left part, for texture.
  for (let l = 0; l < 40; l++) {
    const tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    tx.setAttribute('x', '20'); tx.setAttribute('y', String(180 + l * 22));
    tx.setAttribute('font-size', '15'); tx.setAttribute('fill', '#fff'); tx.setAttribute('font-family', 'sans-serif');
    tx.textContent = `Line ${l}: capture stitch tile seam band scroll page window shot canvas overlap header pixel colour row`;
    rect.parentNode.appendChild(tx);
  }
  const t = document.getElementById('t');
  const DURATION = 2500;
  let start = null, playing = false;
  const frame = (now) => {
    if (start == null) start = now;
    const p = Math.min(1, (now - start) / DURATION);
    const k = Math.round(p * 60);
    rect.setAttribute('fill', `rgb(${(k * 41) % 256},${(k * 97) % 256},${255 - ((k * 23) % 256)})`);
    t.setAttribute('transform', `translate(${Math.round(p * 300)},0)`);
    if (p < 1) requestAnimationFrame(frame); else playing = false;
  };
  const play = () => { if (playing) return; playing = true; start = null; requestAnimationFrame(frame); };
  play();
  addEventListener('scroll', play, { passive: true });
</script>
